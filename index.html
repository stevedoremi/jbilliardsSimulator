<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#13171b">
<title>당구 시스템 연습</title>
<style>
:root{--bg:#eef0f2;--fg:#1c2127;--card:#fff;--line:#d3d8de;--acc:#1f6f55;--mut:#5c6670;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171b;--fg:#e6e9ec;--card:#1e242a;--line:#323a43;--acc:#4cc59a;--mut:#9aa5af}}
:root[data-theme="dark"]{--bg:#13171b;--fg:#e6e9ec;--card:#1e242a;--line:#323a43;--acc:#4cc59a;--mut:#9aa5af}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:4px;background:var(--bg);color:var(--fg);font:14px/1.45 "Noto Sans KR",system-ui,-apple-system,sans-serif}
.wrap{max-width:1200px;margin:0 auto}
:root{--gb:0px}
@media (display-mode: fullscreen),(display-mode: standalone){:root{--gb:max(env(safe-area-inset-bottom,0px),44px)}} /* 앱(전체화면)으로 열 때 화면 맨 아래 제스처 영역(홈 바)과 겹쳐 버튼이 안 눌리는 것 방지 */
.stage{display:flex;flex-direction:column;gap:6px;height:calc(100vh - 8px - var(--gb));height:calc(100dvh - 8px - var(--gb));min-height:420px}
.tbl{flex:none;min-width:0;display:flex;justify-content:center;position:relative}
.ctl{--bh:72px;max-width:600px;width:100%;margin:0 auto;flex:none;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 4px}
.tipw{flex:none;width:var(--bh);height:var(--bh)}
#tip{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#tip.big{position:fixed;z-index:30;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
#modeBtn,#histBtn{flex:none;height:var(--bh);padding:0}
#modeBtn{margin-left:auto}
.sg{flex:none;width:34px;height:var(--bh);display:flex;flex-direction:column;gap:4px}
.sg button{flex:1;min-height:0;width:100%;padding:0;display:flex;align-items:center;justify-content:center}
#setBtn{font-size:18px}
#modeBtn,#histBtn{width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;line-height:1}
#modeBtn span:first-child,#histBtn span:first-child{font-size:18px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rt{display:flex;gap:6px;height:var(--bh)}
#shotBtn{flex:none;width:76px;height:100%;padding:0;font-weight:700;font-size:15px;border-color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 0;touch-action:none;user-select:none;-webkit-user-select:none}
#shotBtn i{font-style:normal;font-size:10px;color:var(--mut);line-height:1}
#shotBtn b{font-size:24px;line-height:1}
#shotBtn span{line-height:1}
#shotSplit{display:none;flex:none;width:76px;height:100%;flex-direction:column;gap:4px}
@media (max-width:380px){.ctl{--bh:60px}.sg{width:30px}#modeBtn,#histBtn{width:46px}#shotBtn,#shotSplit{width:66px}#shotBtn b{font-size:20px}}
@media (max-width:340px){.ctl{--bh:56px}.sg{width:28px}#modeBtn,#histBtn{width:42px}#shotBtn,#shotSplit{width:58px}}
#shotSplit button{flex:1;min-height:0;padding:0;font-size:20px}
.menu{display:none;position:fixed;z-index:20;left:50%;bottom:calc(12px + var(--gb));transform:translateX(-50%);width:min(340px,calc(100vw - 24px));flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.menu.open{display:flex}
.menu{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto}
body.tipopen{touch-action:none}
#tt{position:fixed;z-index:40;pointer-events:none;display:none;transform:translateX(-50%);background:rgba(20,20,20,.9);color:#fff;font-size:14px;font-weight:700;padding:5px 11px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hnav{display:none;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;align-items:center;gap:6px;background:rgba(20,20,20,.65);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:4px 6px;color:#fff}
.hnav.on{display:flex}
.hnav button{height:36px;min-width:46px;padding:0;background:transparent;color:#fff;border-color:rgba(255,255,255,.4);font-size:16px}
.hnav button:disabled{opacity:.3}
.hnav button.arm{background:#c0392b;border-color:#c0392b}
#hDel{font-size:13px;margin-left:4px}
.hnav span{min-width:64px;text-align:center;font-size:13px}
.mrow{display:flex;gap:8px;align-items:center}.mrow>span{min-width:76px;color:var(--mut)}.mrow label{margin:0}
#c{display:block;width:100%;border-radius:6px;touch-action:none;cursor:crosshair}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.card h2{margin:0 0 8px;font-size:14px;font-weight:700}
.row{display:flex;justify-content:space-between;color:var(--mut);margin-top:6px}
.row b{color:var(--fg);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.fill{border-color:var(--acc);font-weight:700}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
label{display:flex;gap:6px;align-items:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="tbl"><canvas id="c"></canvas><div class="hnav" id="hnav"><button id="hPrev">◀</button><span id="hLabel"></span><button id="hNext">▶</button><button id="hDel" title="지금 보이는 기록 삭제">삭제</button></div></div>
    <div class="ctl">
      <div class="sg"><button id="setBtn" title="설정">⚙</button><button id="guideBtn" class="on" title="가이드선 켜기/끄기"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 15 L9 4 L16 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      <button id="modeBtn" title="공 이동 모드"><span>✥</span><span>공 이동</span></button>
      <button id="histBtn" title="샷 기록 보기"><span>⟲</span><span>기록</span></button>
      <div class="tipw"><canvas id="tip" width="320" height="320"></canvas></div>
      <div class="rt">
        <button id="shotBtn" title="누르면 샷 · 위아래로 드래그하면 레일 스피드 변경"><i>▲</i><b id="lenV">3</b><span>● 샷</span><i>▼</i></button>
        <div id="shotSplit"><button id="shotUndo" title="이전 배치로 돌아가기">↺</button><button id="shotSkip" title="결과 바로 보기">⏭</button></div>
      </div>
      <input id="len" type="number" min="0.5" max="5" step="0.5" value="3" style="display:none">
    </div>
  </div>
  <div id="tt"></div>
  <div class="menu" id="setMenu">
    <div class="mrow"><span>당점 표시</span><label><input type="radio" name="tm" value="grid">격자</label><label><input type="radio" name="tm" value="clock" checked>시계</label></div>
    <div class="mrow"><span>전체화면</span><button id="fsBtn">전체화면 켜기/끄기</button></div>
    <div class="mrow"><span>테이블 회전</span><button id="rotL">⟲ 90°</button><button id="rotR">⟳ 90°</button></div>
    <div class="mrow"><label><input type="checkbox" id="rect" checked>공중심사각형 표시</label></div>
    <div class="mrow" style="justify-content:space-between"><span>샷 기록</span><button id="histClear">모두 지우기</button></div>
    <div class="mrow"><button id="setClose" style="margin-left:auto">닫기</button></div>
    <span id="tl" hidden></span><span id="ang" hidden></span>
  </div>
  <div class="panel">
    <div class="card">
      <h2>쿠션 반응 (핑·퉁)</h2>
      <div id="pt" style="font-size:14px;line-height:1.6;color:var(--mut)"></div>
    </div>
    <div class="card">
      <h2>시스템 경로</h2>
      <div class="row" style="margin-top:0"><span>시스템</span><select id="sysSel" style="max-width:140px"></select></div>
      <div style="display:flex;gap:6px;margin-top:6px"><input id="sysName" type="text" placeholder="새 시스템 이름" style="flex:1;min-width:0"><button id="sysAdd">추가</button></div>
      <div style="margin-top:6px"><button id="sysDel" style="display:none">시스템 삭제</button></div>
      <label id="learnRow" style="display:none;margin-top:6px"><input type="checkbox" id="learn">학습 모드 (선택한 세트 연습)</label>
      <label style="margin-top:6px"><input type="checkbox" id="extTail">마지막 C 이후도 엔진으로 이어 그리기</label>
      <div style="margin-top:6px"><button id="snapCue">수구를 C0 선분 위로</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><button id="recBtn">새 세트 입력</button><button id="recDone" style="display:none">세트 완료</button><button id="recCancel" style="display:none">취소</button></div>
      <div id="chips" style="display:none;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center"></div>
      <div id="rs" style="color:var(--mut);min-height:20px;margin-top:4px"></div>
      <div id="slist" style="margin-top:6px"></div>
      <div style="margin-top:6px"><button id="delSel" style="display:none">선택 삭제</button></div>
      <div id="fmsg" style="color:var(--mut);font-size:12px;margin-top:4px;min-height:16px"></div>
      <div id="sinfo" style="color:var(--mut);margin-top:6px"></div>
      <div id="sedit" style="display:none;flex-wrap:wrap;gap:6px;margin-top:6px"><button id="eBtn">점 수정</button><button id="eTip">당점 적용</button></div>
      <div style="display:none"><textarea id="data"></textarea><span id="msg"></span></div>
    </div>
  </div>
</div>
<script>
const W=2840,H=1420,R=32.75,M=170;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const tp=document.getElementById('tip'),tc=tp.getContext('2d');
const balls=[{x:700,y:710,c:'#fafafa'},{x:2000,y:420,c:'#ffd21f'},{x:2100,y:1020,c:'#d62d2d'}];
let aim=Math.atan2(balls[1].y-balls[0].y,balls[1].x-balls[0].x),sx=0,sy=0,S=1,dpr=1;
const $=id=>document.getElementById(id);

let tipOpen=false,tipRad=0,histMode=false;
const CUE_L=1300,CUE_GAP=20,CUE_FINE=40000; // 큐 길이/수구와의 간격(mm), 큐 잡고 끌 때 미세 조정 비율(클수록 더 미세)
let rot=0,rotManual=false; // 테이블 회전(시계방향 90° 단위, 0~3)
function resize(){
  if(!rotManual)rot=innerHeight>innerWidth?1:0; // 세로 화면이면 당구대를 세워서 화면 전체 사용
  const pe=cv.parentElement,st=pe.parentElement,w=pe.clientWidth,ph=st.clientHeight-[...st.children].reduce((a,e)=>a+(e===pe?0:e.offsetHeight+6),0);dpr=window.devicePixelRatio||1;
  const TW=W+2*M,TH=H+2*M,odd=rot%2===1,aw=odd?TH:TW,ah=odd?TW:TH;
  let cw=w;const mh=Math.max(100,ph);
  if(cw*ah/aw>mh)cw=mh*aw/ah;
  const ch=cw*ah/aw;
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.margin='0 auto';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);S=cv.width/aw;draw();
if(tipOpen){tipBig(false);tipRad=tipBig(true)}
}
function drawCue(){ // 수구 뒤쪽에 진행방향과 일직선으로 큐를 그림
  const c=balls[0],x0=-(R+CUE_GAP),w=t=>18+28*t/CUE_L;
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(aim);
  const seg=(a,b,col)=>{ctx.beginPath();ctx.moveTo(x0-a,-w(a)/2);ctx.lineTo(x0-b,-w(b)/2);ctx.lineTo(x0-b,w(b)/2);ctx.lineTo(x0-a,w(a)/2);ctx.closePath();ctx.fillStyle=col;ctx.fill()};
  seg(0,14,'#4a90d9');seg(14,48,'#f4f1e8');seg(48,820,'#e3c288');seg(820,CUE_L,'#4b2e1a');
  ctx.restore();
}
function drawAimLine(){ // 큐가 가리키는 방향을 테이블 최외곽(프레임 바깥 가장자리)까지 파란 직선으로
  const c=balls[0],dx=Math.cos(aim),dy=Math.sin(aim);
  const tx=dx>1e-9?(W+M-c.x)/dx:dx<-1e-9?(-M-c.x)/dx:1e18,ty=dy>1e-9?(H+M-c.y)/dy:dy<-1e-9?(-M-c.y)/dy:1e18,t=Math.min(tx,ty);
  ctx.save();ctx.setLineDash([]);ctx.lineCap='round';ctx.lineWidth=2.5*dpr/S;ctx.strokeStyle='rgba(41,128,255,.95)';
  ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+dx*t,c.y+dy*t);ctx.stroke();
  ctx.restore();
}
function cueHit(p){
  const c=balls[0],dx=Math.cos(aim),dy=Math.sin(aim),rx=p.x-c.x,ry=p.y-c.y;
  const along=-(rx*dx+ry*dy)-(R+CUE_GAP),lat=Math.abs(-rx*dy+ry*dx),tol=28*dpr/S;
  return along>-12&&along<CUE_L+tol&&lat<tol;
}
function xform(){
  const TW=W+2*M,TH=H+2*M;
  if(rot===0)ctx.setTransform(S,0,0,S,M*S,M*S);
  else if(rot===1)ctx.setTransform(0,S,-S,0,S*(TH-M),S*M);
  else if(rot===2)ctx.setTransform(-S,0,0,-S,S*(TW-M),S*(TH-M));
  else ctx.setTransform(0,-S,S,0,S*M,S*(TW-M));
}
addEventListener('resize',resize);

/* ---- 궤적 계산 (공중심사각형 기준) ---- */
function wallT(p,v){
  let t=Infinity,m=null;
  if(v.x>1e-9){const q=Math.max(0,(W-R-p.x)/v.x);if(q<t){t=q;m={x:1,y:0}}}
  else if(v.x<-1e-9){const q=Math.max(0,(R-p.x)/v.x);if(q<t){t=q;m={x:-1,y:0}}}
  if(v.y>1e-9){const q=Math.max(0,(H-R-p.y)/v.y);if(q<t){t=q;m={x:0,y:1}}}
  else if(v.y<-1e-9){const q=Math.max(0,(R-p.y)/v.y);if(q<t){t=q;m={x:0,y:-1}}}
  return{t,m};
}
/* ---- 물리엔진 (mm, s). 좌표: x→, y↓, z↓(테이블 방향). wz>0 = 위에서 볼 때 시계방향 (왼쪽 당점 → 시계방향, 오른쪽 당점 → 반시계방향) ----
   상태: 위치, 선속도(vx,vy), 각속도(wx,wy,wz). 천 마찰(미끄럼→구름), 쿠션/공 충돌 시 접촉점 상대속도와 쿠션·공 마찰로 회전 갱신 */
// 물리 상수: TIP_EFF=당점 회전 세기 보정(레일 N이 '마찰 받고도 N레일 이동'이 되도록 초속이 크게 잡혀서, 회전을 같은 비율로 줄여 하단/좌우가 과해지지 않게 맞춘 값), MU_S=천 미끄럼 마찰(문헌 전형 0.2, 범위 0.15~0.4), MU_B=공-공 마찰(문헌 전형 0.06), ALPHA_Z=좌우(수직축) 회전 감쇠(rad/s²)
const TIP_EFF=0.25,GRAV=9810,MU_S=0.2,A_ROLL=100,ALPHA_Z=14,E_B=0.96,MU_B=0.06,DT=0.001;
function slide(b,dt){
  const ux=b.vx+R*b.wy,uy=b.vy-R*b.wx,us=Math.hypot(ux,uy); // 천과 닿는 점의 상대속도
  if(us>1){
    const f=Math.min(1,us/(3.5*MU_S*GRAV*dt)),ax=-MU_S*GRAV*ux/us*f,ay=-MU_S*GRAV*uy/us*f;
    b.vx+=ax*dt;b.vy+=ay*dt;b.wx+=-2.5*ay/R*dt;b.wy+=2.5*ax/R*dt;
  }else{
    const sp=Math.hypot(b.vx,b.vy),k=sp>0?Math.max(0,sp-A_ROLL*dt)/sp:0;
    b.vx*=k;b.vy*=k;b.wy=-b.vx/R;b.wx=b.vy/R;
  }
  const d=ALPHA_Z*dt; // 천 접촉면 회전(피벗) 마찰: 방향은 바꾸지 않음
  if(b.wz)b.wz=Math.abs(b.wz)<=d?0:b.wz-Math.sign(b.wz)*d;
}
function mark(cx,b,k,info){const p={x:b.x,y:b.y};cx.pts.push(p);cx.last=p;if(k)cx.ev.push(Object.assign({k,p},info))}
/* ---- 쿠션 충돌 모델 (교체 가능) ----
   입력/출력은 쿠션 기준 지역 좌표: v1=쿠션 쪽 속도, v2=쿠션과 나란한 속도, w1·w2·w3=각속도(축: 쿠션 법선, 접선, 아래쪽).
   w3>0 = 위에서 볼 때 시계방향. 반환: [v1',v2',w1',w2',w3'] */
const CUSHION_MODEL='han2005'; // 'han2005' | 'impulse' | 'simple'
const RULE_REFLECT_LE_INCIDENT=true; // 사용자 요구: 정회전·무회전이면 반사각 ≤ 입사각 (끄면 모델 결과 그대로)
const CU={e:0.8,muW:0.14,muT:0.2,h:37}; // 쿠션 반발(에너지 기준), 공-쿠션 마찰, 충돌 중 공-천 마찰, 쿠션 높이(mm, 슬레이트 기준)
// impulse: 충돌 중 법선 충격량을 조금씩 키우며 쿠션 접촉점·천 접촉점의 미끄럼과 마찰(쿠션 높이 h)을 적분.
// 압축 구간에서 접촉점 법선속도가 0이 될 때까지, 이후 반발 구간에서 e²×압축일 만큼 되돌려 줌 (Stronge 방식). 공은 천 위에 머문다고 가정(점프 무시)
function cushionImpulse(v1,v2,w1,w2,w3){
  const sn=(CU.h-R)/R,cs=Math.sqrt(1-sn*sn),I=0.4*R*R,e2=CU.e*CU.e;
  const uwx=()=>v1-R*sn*w2;
  const u0=uwx();if(u0<=0)return[v1,v2,w1,w2,w3];
  const dP=u0/400;let Wc=0,Wr=0,comp=true;
  for(let it=0;it<3000;it++){
    const uy=v2+R*cs*w3+R*sn*w1,uz=-R*cs*w2;           // 쿠션 접촉점의 미끄럼 속도 (접선·수직)
    const sx=v1+R*w2,sy=v2-R*w1;                          // 천 접촉점의 미끄럼 속도

/* ---- 핑퉁 분석: 핑=회전으로 꺾인 각도, 퉁=쿠션에서 되튀는 수직속도(수직 입사·강한 충돌일수록 큼) ---- */

  });

    if(au){ctx.lineWidth=4;ctx.beginPath();ctx.arc(m.x,m.y,10,0,7);ctx.stroke()}
    else{ctx.beginPath();ctx.arc(m.x,m.y,k==='F'?13:9,0,7);ctx.fill()}
    const d=k==='F'?33:-55,lx=m.x+u.x*d,ly=m.y+u.y*d;
    ctx.save();ctx.translate(lx,ly);ctx.rotate(-rot*Math.PI/2);
    ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText('C'+i,0,0);
    ctx.fillStyle='#fff';ctx.fillText('C'+i,0,0);ctx.restore();
    ctx.globalAlpha=1;
  });
}
const CV=115/(W/8); // 다이아몬드 선 사각형 모서리까지의 거리(다이아몬드 단위, ≈0.324)
function snapV(v,mx,ext){ // 0.1(10등분) 단위. 프레임점은 사각형 모서리까지 확장하고 끝점은 모서리로 스냅
  const lo=ext?-CV:0,hi=mx+(ext?CV:0);
  v=Math.min(hi,Math.max(lo,v));
  if(ext){if(v<=-0.312)return Math.round(-CV*1e4)/1e4;if(v>=mx+0.312)return Math.round((mx+CV)*1e4)/1e4}
  return Math.round(v*10)/10;
}
function snapFrame(p){
  const out={T:-p.y,B:p.y-H,L:-p.x,R:p.x-W};
  const F=Math.max(out.T,out.B,out.L,out.R)>0; // 쿠션날 바깥=프레임포인트, 안쪽=쿠션날 포인트
  let r='T',bd=1e9;
  for(const k of ['T','B','L','R']){const d=Math.abs(out[k]-(F?115:0));if(d<bd){bd=d;r=k}}
  const hz=r==='T'||r==='B',mx=hz?8:4,v=hz?p.x/(W/8):p.y/(H/4);
  return[r,snapV(v,mx,F),F?'F':'N'];
}
function hv(){return hover?' · '+(hover[2]==='F'?'프레임 ':'쿠션날 ')+hover[0]+' '+(Math.abs(hover[1]*10-Math.round(hover[1]*10))<1e-6?hover[1].toFixed(1):hover[1].toFixed(2)):''}
function status(){
  let t=(curSys&&!$('learn').checked)?'시스템 편집: 세트를 선택하거나 새 세트를 입력하세요':'공 드래그: 배치 · 빈 곳 드래그: 큐선 방향';
  if(recMode)t='C'+tgt+' 입력 중'+hv();
  else if(editOn&&selSet>=0)t=editIdx<0?'수정할 C점을 클릭':'C'+editIdx+' → 새 위치 클릭'+hv();
  $('rs').textContent=t;
}
function fmtTip(a){
  const x=a[0],y=a[1],n=Math.round(x/0.1),j=Math.round(2-y/0.3);
  if(j>=0&&j<5&&Math.abs(n)<=8&&okCell(j,n)&&Math.abs(gx(n)-x)<1e-3&&Math.abs(gy(j)-y)<1e-3)return HN[j]+' '+xLabel(n);
  const t=Math.round(Math.hypot(x,y)/0.1);if(!t)return'중심';
  const q=(Math.round(Math.atan2(x,y)/(Math.PI/12))+24)%24;
  return hLabel(q)+' '+t/2+'팁';
}
function trimC(c){while(c.length&&!c[c.length-1])c.pop();return c}
function saveSets(){
  sets.forEach(t=>t.cf=fullC(t.c));
  $('data').value='[\n'+sets.map(t=>JSON.stringify({system:t.sn,tip:t.tl,c:t.c})).join(',\n')+'\n]';
  $('msg').textContent=sets.length+'세트';renderList();
  autoSave();
}
function renderChips(){
  const box=$('chips'),show=recMode||(editOn&&selSet>=0&&!!sets[selSet]);
  box.style.display=show?'flex':'none';
  if(!show)return;
  const cur=recMode?recPts:sets[selSet].c,sel=recMode?tgt:editIdx;
  box.innerHTML='';
  for(let i=0;i<8;i++){
    const b=document.createElement('button');b.textContent='C'+i;
    b.className=(i===sel?'on':'')+(cur[i]?' fill':'');
    b.onclick=()=>{if(recMode)tgt=i;else editIdx=editIdx===i?-1:i;hover=null;renderChips();status();draw()};
    box.appendChild(b);
  }
  const d=document.createElement('button');d.textContent='C점 삭제';
  d.onclick=()=>{
    if(recMode)recPts[tgt]=null;
    else if(editIdx>=0&&sets[selSet]){sets[selSet].c[editIdx]=null;trimC(sets[selSet].c);saveSets();return}
    renderChips();status();draw();
  };
  box.appendChild(d);
}
function renderList(){
  const L=$('slist');L.innerHTML='';
  let vi=0;
  sets.forEach((t,i)=>{
    if(curSys&&t.sn!==curSys)return;vi++;
    const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;align-items:center;margin-top:4px';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=chk.has(i);
    cb.onchange=()=>{if(cb.checked)chk.add(i);else chk.delete(i)};
    const b=document.createElement('button');b.textContent=(curSys?'':t.sn+' · ')+'세트 '+vi+' · '+t.tl;
    b.style.cssText='flex:1;text-align:left;font-size:12px;padding:3px 8px';
    if(i===selSet)b.className='on';
    b.onclick=()=>selectSet(i===selSet?-1:i);
    row.append(cb,b);L.appendChild(row);
  });
  $('delSel').style.display=sets.length?'inline-block':'none';
  const ok=selSet>=0&&!!sets[selSet]&&!recMode;
  $('sedit').style.display=ok?'flex':'none';
  $('sinfo').textContent=ok?sets[selSet].sn+' · '+sets[selSet].tl:'';
  $('eBtn').className=editOn?'on':'';
  renderChips();
}
function selectSet(i){
  selSet=i;editOn=false;editIdx=-1;hover=null;
  const t=sets[i];
  if(t){ // 시스템 경로가 선택한 세트 값 그대로 나오도록 당점·C0 입력을 맞춤
    sx=t.tip[0];sy=t.tip[1];tmode=/시/.test(t.tl)?'clock':'grid';
    document.querySelector('input[name=tm][value='+tmode+']').checked=true;
  }
  renderList();status();draw();
}
function editClick(e){
  const p=wpos(e),t=sets[selSet];
  if(editIdx<0){
    let b=-1,bd=60;
    t.c.forEach((q,i)=>{
      if(!q)return;
      const m=(q[2]==='N'?nosePos:framePos)(q[0],q[1]),d=Math.hypot(m.x-p.x,m.y-p.y);
      if(d<bd){bd=d;b=i}
    });
    editIdx=b;
  }else{
    while(t.c.length<=editIdx)t.c.push(null);
    t.c[editIdx]=snapFrame(p);editIdx=-1;hover=null;saveSets();
  }
  renderChips();status();draw();
}
function editHover(e){hover=editIdx>=0?snapFrame(wpos(e)):null;status();draw()}
function recHover(e){hover=snapFrame(wpos(e));status();draw()}
function recClick(e){
  recPts[tgt]=snapFrame(wpos(e));hover=null;
  if(tgt<7)tgt++;
  renderChips();status();draw();
}
function updateRecUI(){
  $('recBtn').style.display=recMode?'none':'inline-block';
  $('recDone').style.display=recMode?'inline-block':'none';
  $('recCancel').style.display=recMode?'inline-block':'none';
  renderList();
}
function stopRec(){recMode=false;recPts=[];hover=null;tgt=0;updateRecUI();status()}
$('recBtn').onclick=()=>{recMode=true;recPts=Array(8).fill(null);tgt=0;hover=null;editOn=false;editIdx=-1;updateRecUI();status();draw()};
$('recCancel').onclick=()=>{stopRec();draw()};
$('recDone').onclick=()=>{
  if(!recPts[0]||recPts.filter(Boolean).length<2){$('rs').textContent='C0를 포함해 2개 이상 입력하세요';return}
  if(!curSys){curSys='시스템 '+(sysNames.length+1);sysNames.push(curSys)}
  sets.push({sn:curSys,tip:[sx,sy],tl:tipLabel(),c:trimC(recPts.slice())});
  selSet=sets.length-1;renderSys();stopRec();saveSets();draw();
};
$('eBtn').onclick=()=>{editOn=!editOn;editIdx=-1;hover=null;renderList();status();draw()};
$('eTip').onclick=()=>{if(selSet<0||!sets[selSet])return;sets[selSet].tip=[sx,sy];sets[selSet].tl=tipLabel();saveSets();draw()};
$('delSel').onclick=()=>{
  if(!chk.size)return;
  let ns=-1;const keep=[];
  sets.forEach((t,i)=>{if(!chk.has(i)){if(i===selSet)ns=keep.length;keep.push(t)}});
  sets=keep;selSet=ns;chk.clear();editOn=editOn&&ns>=0;editIdx=-1;saveSets();draw();
};
function ballMode(){ // 시스템 편집 중에는 공 3개를 테이블 바깥으로 치우고, 기본/학습 모드에서 원위치
  const hide=!!curSys&&!$('learn').checked;
  if(hide&&!ballSave){ballSave=balls.map(b=>({x:b.x,y:b.y}));balls.forEach((b,i)=>{b.x=-800;b.y=-800+i*120})}
  else if(!hide&&ballSave){balls.forEach((b,i)=>{b.x=ballSave[i].x;b.y=ballSave[i].y});ballSave=null}
}
function renderSys(){
  const sel=$('sysSel');sel.innerHTML='';
  const o0=document.createElement('option');o0.value='';o0.textContent='없음 (기본 엔진)';sel.appendChild(o0);
  sysNames.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)});
  sel.value=curSys;
  $('sysDel').style.display=curSys?'inline-block':'none';
  $('learnRow').style.display=curSys?'flex':'none';
  ballMode();
}
function pickSys(n){curSys=n;selSet=-1;editOn=false;editIdx=-1;chk.clear();renderSys();renderList();status();draw()}
$('sysSel').onchange=e=>pickSys(e.target.value);
$('sysAdd').onclick=()=>{const n=$('sysName').value.trim();if(!n)return;if(!sysNames.includes(n))sysNames.push(n);$('sysName').value='';pickSys(n)};
$('sysDel').onclick=()=>{
  if(!curSys)return;
  sets=sets.filter(t=>t.sn!==curSys);sysNames=sysNames.filter(n=>n!==curSys);
  curSys='';selSet=-1;editOn=false;editIdx=-1;chk.clear();saveSets();renderSys();draw();
};
/* ---- JSON 파일 연결 (Chrome File System Access): 세트 저장·수정·삭제 때마다 연결한 파일을 자동 갱신 ---- */
const idb={
  open:()=>new Promise((res,rej)=>{const r=indexedDB.open('billiard-trainer',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('h').objectStore('h').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite').objectStore('h').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
};
const RW={mode:'readwrite'},FT=[{description:'JSON',accept:{'application/json':['.json']}}];
const say=t=>{$('fmsg').textContent=t};
const dump=()=>{$('data').value='[\n'+sets.map(t=>JSON.stringify({system:t.sn,tip:t.tl,c:t.c})).join(',\n')+'\n]'};
let wq=Promise.resolve(),askedPick=false,pendingRestore=false,restoreP=null,restoreFail='';
const errTxt=e=>(e&&(e.name?e.name+': ':'')+(e.message||''))||String(e);
// 세트가 바뀔 때마다(저장·수정·삭제) 고정된 JSON 파일 하나를 다시 씀. 파일은 처음 저장할 때 한 번만 지정
function autoSave(){
  if(!window.showSaveFilePicker)return;
  wq=wq.then(async()=>{
    try{
      if(restoreP)await restoreP;
      if(restoreFail){say('저장 보류: 기존 파일을 불러오지 못했습니다 ('+restoreFail+')');return} // 불러오기 실패 상태에서 덮어쓰지 않음
      if(!fh){
        if(askedPick)return;askedPick=true;
        fh=await showSaveFilePicker({suggestedName:'billiard-systems.json',types:FT});
        try{await idb.set('file',fh)}catch(e){}
        const old=await (await fh.getFile()).text();
        if(old.trim()){ // 이미 내용이 있는 파일이면 지우지 않고 현재 세트를 뒤에 합침
          try{const a=JSON.parse(old);if(Array.isArray(a)){const cur=JSON.parse($('data').value);$('data').value=JSON.stringify(a.concat(cur));applySets();dump()}}catch(e){}
        }
      }
      if(await fh.queryPermission(RW)!=='granted'&&await fh.requestPermission(RW)!=='granted'){say('JSON 파일 쓰기 권한이 필요합니다');return}
      const w=await fh.createWritable();await w.write($('data').value);await w.close();
      say('JSON 저장됨 '+new Date().toLocaleTimeString()+' · '+fh.name);
    }catch(e){if(e&&e.name==='AbortError')askedPick=true;else say('JSON 저장 실패: '+errTxt(e))}
  });
}
async function loadFrom(h){
  const text=await (await h.getFile()).text();
  if(!text.trim())return;
  let a;try{a=JSON.parse(text)}catch(e){throw new Error('JSON 형식 오류: '+e.message)}
  if(!Array.isArray(a))throw new Error('세트 배열 형식이 아닙니다');
  $('data').value=text;applySets();
}
function restoreFailed(e){ // 파일이 없어졌으면 다음 저장 때 다시 지정, 그 외에는 저장을 막아 기존 파일을 보호
  if(e&&e.name==='NotFoundError'){fh=null;askedPick=false;restoreFail='';say('저장 파일을 찾을 수 없습니다. 다음 저장 때 다시 지정합니다');return}
  restoreFail=errTxt(e);pendingRestore=true;say('불러오기 실패 ('+restoreFail+') — 화면을 다시 클릭하면 재시도합니다');
}
(async()=>{ // 실행할 때 저장된 JSON 파일 하나만 불러옴 (권한 허용에는 클릭이 필요해서, 필요하면 첫 클릭 때 불러옴)
  if(!window.showSaveFilePicker)return;
  try{
    const h=await idb.get('file');if(!h)return;
    fh=h;
    if(await h.queryPermission(RW)==='granted'){await loadFrom(h);say('불러옴 · '+h.name)}
    else{pendingRestore=true;say(h.name+' — 화면을 한 번 클릭하면 불러옵니다')}
  }catch(e){restoreFailed(e)}
})();
document.addEventListener('click',()=>{ // 클릭 안에서만 권한을 요청할 수 있음
  if(!pendingRestore||!fh||restoreP)return;
  pendingRestore=false;
  restoreP=(async()=>{
    try{
      if(await fh.requestPermission(RW)!=='granted'){pendingRestore=true;say('쓰기 권한이 필요합니다 — 화면을 다시 클릭하세요');return}
      await loadFrom(fh);restoreFail='';say('불러옴 · '+fh.name);
    }catch(e){restoreFailed(e)}
  })().finally(()=>{restoreP=null});
},true);
$('extTail').onchange=draw;
$('learn').onchange=()=>{
  ballMode();
  if($('learn').checked&&curSys&&!(sets[selSet]&&sets[selSet].sn===curSys)){const i=sets.findIndex(t=>t.sn===curSys);if(i>=0){selectSet(i);return}}
  status();draw();
};
$('rotL').onclick=()=>{rotManual=true;rot=(rot+3)%4;resize()};
$('rotR').onclick=()=>{rotManual=true;rot=(rot+1)%4;resize()};
$('snapCue').onclick=()=>{
  const sp=sysPath();if(!sp)return;
  const{a,b}=sysLine(sp);balls[0].x=a.x;balls[0].y=a.y;
  if(b!==a)aim=Math.atan2(b.y-a.y,b.x-a.x);
  draw();
};
applySets();
status();
resize();
</script>
